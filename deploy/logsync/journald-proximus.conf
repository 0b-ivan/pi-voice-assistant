# Proximus: the journal lives in RAM only (/run/log/journal, lost at reboot);
# proximus-logsync copies it to the memory stick every 5 min, when the stick
# is plugged in and at shutdown. Install to
# /etc/systemd/journald.conf.d/50-proximus.conf (deploy/logsync/install.sh).
[Journal]
Storage=volatile
# /run is a small tmpfs on the Pi Zero 2 W: 16 MB hold well over a day.
RuntimeMaxUse=16M
RuntimeMaxFileSize=4M
ForwardToSyslog=no
