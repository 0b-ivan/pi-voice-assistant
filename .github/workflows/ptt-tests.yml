name: PTT tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow numpy qrcode
      - run: python -m unittest discover -s tests -v

  web-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/web-journal.cjs

  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Öffentlichen Web-Client abrufen (ohne Zugangsdaten)
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://proximus.obivan.org
          curl --fail-with-body --silent --show-error --location --max-time 20 "$BASE/health" -o /tmp/proximus-health.json
          python3 - <<'PY'
          import json
          with open('/tmp/proximus-health.json') as f:
              health = json.load(f)
          assert health.get('ok') is True, health
          print('Live-Health erreichbar, ready:', health.get('ready'))
          PY
          curl --fail-with-body --silent --show-error --location --max-time 20 "$BASE/" -o /tmp/proximus-live.html
          grep -q 'id="dial-form"' /tmp/proximus-live.html
          grep -q 'id="question"' /tmp/proximus-live.html
          curl --fail-with-body --silent --show-error --location --max-time 20 "$BASE/web/app.js" -o /tmp/proximus-live.js
          grep -q '/v1/journal' /tmp/proximus-live.js
          if grep -q 'Störungen hoch' /tmp/proximus-live.js; then
            echo 'Hinweis: Live-Client läuft noch mit alten Vox-Formulierungen.'
          else
            echo 'Live-Client enthält die korrigierten Vox-Formulierungen.'
          fi
          echo 'Öffentlicher Live-Smoketest erfolgreich (ohne Anmeldung/Sprachturn).'
