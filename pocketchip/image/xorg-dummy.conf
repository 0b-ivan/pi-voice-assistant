# QEMU-only Xorg software test. Not an emulation of PocketCHIP display hardware.
Section "Device"
    Identifier "QEMUDummy"
    Driver "dummy"
    VideoRam 16384
EndSection
Section "Monitor"
    Identifier "VirtualMonitor"
    HorizSync 1.0 - 200.0
    VertRefresh 1.0 - 200.0
    # Pixel clock >=25 MHz to satisfy the Xorg dummy driver mode validation.
    Modeline "480x272" 25.175 480 520 600 800 272 300 340 525 -HSync +VSync
EndSection
Section "Screen"
    Identifier "VirtualScreen"
    Device "QEMUDummy"
    Monitor "VirtualMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "480x272"
        Virtual 480 272
    EndSubSection
EndSection
Section "ServerLayout"
    Identifier "SoftwareTest"
    Screen "VirtualScreen"
EndSection
